services:
  postgres:
    image: postgres:16
    container_name: stamsoft-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stamsoft
      POSTGRES_USER: stamsoft_user
      POSTGRES_PASSWORD: stamsoft_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
